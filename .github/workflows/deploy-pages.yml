name: Deploy Pages

# Publishes the static trends dashboard (built into public/) to GitHub Pages.
#
# Kept separate from CI so that deployment concerns and the (broad) Pages
# permissions live in their own workflow. It runs after CI completes (so it
# picks up any freshly committed history/), and can also be pushed or triggered
# manually.
on:
  # Deploy after the CI workflow finishes on main, so the dashboard reflects the
  # latest committed run history.
  workflow_run:
    workflows: ['CI']
    types: [completed]
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Permissions required by the GitHub Pages deployment actions.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment; don't cancel an in-progress deploy, let
# it finish to avoid leaving Pages in a half-published state.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build dashboard
    runs-on: ubuntu-latest
    # For the workflow_run trigger, only build when CI actually succeeded.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # The dashboard build only reads committed history/run-*.json and writes
      # public/ — it does NOT need Playwright browsers, so we skip that install.
      - name: Build dashboard
        run: npm run dashboard

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
